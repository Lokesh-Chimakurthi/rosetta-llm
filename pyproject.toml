[project]
name = "rosetta-llm"
version = "0.2.1"
description = "Multi-format bidirectional LLM proxy — translates between OpenAI Chat, OpenAI Responses, and Anthropic Messages"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Lokesh Chimakurthi", email = "lokeshchimakurthi19@gmail.com" }
]
dependencies = [
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "orjson>=3.11.8",
    "pydantic>=2.13.3",
    "structlog>=25.5.0",
    "tiktoken>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/Lokesh-Chimakurthi/rosetta-llm"
Repository = "https://github.com/Lokesh-Chimakurthi/rosetta-llm"
Issues = "https://github.com/Lokesh-Chimakurthi/rosetta-llm/issues"

[project.scripts]
rosetta-llm = "rosetta.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "mypy>=1.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta"]

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "ASYNC",    # async correctness
    "TID",      # Some good import practices
    "RUF",      # Ruff-specific rules
    "PTH",      # Use pathlib instead of os.path
    "NPY",      # Some numpy-specific things
    "FURB",     # Suggest more idiomatic Python patterns
    "B",        # Bugbear
    "PT",       # Pytest rules
    "S",        # flake8-bandit security rules
    "FAST",     # Fastapi rules
]
ignore = [
    "PLR0913",     # many-args: DI constructors legitimately take several deps
    "PLR2004",     # magic-value: noisy in tests and thresholds
    "E501"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "N802", "S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["rosetta"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.fastapi]
entrypoint = "rosetta.asgi:app"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
