[project]
name = "rosetta-llm"
version = "0.1.0"
description = "Multi-format bidirectional LLM proxy — translates between OpenAI Chat, OpenAI Responses, and Anthropic Messages"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Lokesh Chimakurthi", email = "lokeshchimakurthi19@gmail.com" }
]
dependencies = [
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "orjson>=3.11.8",
    "pydantic>=2.13.3",
    "structlog>=25.5.0",
    "tiktoken>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/Lokesh-Chimakurthi/rosetta-llm"
Repository = "https://github.com/Lokesh-Chimakurthi/rosetta-llm"
Issues = "https://github.com/Lokesh-Chimakurthi/rosetta-llm/issues"

[project.scripts]
rosetta-llm = "rosetta.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "mypy>=1.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta"]

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rosetta"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.fastapi]
entrypoint = "rosetta.asgi:app"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
